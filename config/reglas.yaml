# ---------------------------------------------------------------------------
# Duplicados (L3)
# ---------------------------------------------------------------------------
duplicados:
  minimo_palabras: 8
  similitud: 92
  # Protección de rendimiento: a partir de este número de párrafos solo se
  # comparan bloques con una longitud parecida.
  maximo_parrafos: 2000

