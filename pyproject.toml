[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "onirifix"
version = "0.1.0"
description = "Corrector editorial offline y determinista para obras de ficción, con registro SQLite y reglas L1/L2/L3."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OniriFix contributors" },
]
keywords = [
  "ficción",
  "corrección",
  "ortografía",
  "edición",
  "novela",
  "cli",
  "sqlite",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "PyYAML>=6.0",
  "regex>=2024.5.15",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
ortografia = ["spylls>=0.1.7"]
docx = ["python-docx>=1.1"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-regex>=2024.5.15",
]
build = [
  "pyinstaller>=6.0",
  "pillow>=10.4",
]
todo = [
  "spacy>=3.7",
  "spylls>=0.1.7",
  "python-docx>=1.1",
]

[project.scripts]
onirifix = "onirifix.cli:cli"

[project.urls]
Homepage = "https://github.com/onirifix/onirifix"
Documentation = "https://github.com/onirifix/onirifix/tree/main/docs"
Repository = "https://github.com/onirifix/onirifix"
Issues = "https://github.com/onirifix/onirifix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/onirifix"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "lento: pruebas que requieren dependencias opcionales o corpus grandes",
]

[tool.coverage.run]
source = ["src/onirifix"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src/onirifix"]
